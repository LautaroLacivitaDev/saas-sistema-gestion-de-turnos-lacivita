# Blueprint de Render para el backend (proyecto de portfolio, plan gratis).
# Render > New > Blueprint > este repositorio. Los valores marcados "sync: false" se cargan a mano en
# Render (son secretos o dependen de las otras cuentas); ver README, sección "Publicación".
services:
  - type: web
    name: laciturnos-api
    runtime: docker
    plan: free
    # Cerca de la base de Neon (AWS us-east-1).
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      # jdbc:postgresql://<host de Neon>/<base>?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Rol de la aplicación, sin privilegios (Row Level Security le aplica).
      - key: DATABASE_USERNAME
        value: turnos_app
      - key: DATABASE_PASSWORD
        sync: false
      # Rol dueño de las tablas, solo para las migraciones de Flyway.
      - key: FLYWAY_USERNAME
        sync: false
      - key: FLYWAY_PASSWORD
        sync: false
      # https://<proyecto>.vercel.app (los links de los emails y el login con Google).
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_FROM
        value: no-responder@example.com
      - key: TURNSTILE_SECRET_KEY
        sync: false
