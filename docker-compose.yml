# Servicios para desarrollo local. No usar en producción.
#   docker compose up -d     levanta PostgreSQL y Mailpit
#   docker compose down      los detiene (los datos quedan en el volumen)
#   docker compose down -v   los detiene y borra la base

name: turnos

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
      TZ: UTC
    ports:
      # DECISIÓN: 5433 en el host para no chocar con un PostgreSQL instalado localmente en el 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interfaz web: http://localhost:8025

volumes:
  postgres-data:
