# Configuración común a todos los entornos.
# Lo específico de cada entorno va en application-{perfil}.yml.
spring:
  application:
    name: laciturnos
  profiles:
    # Sin perfil explícito se usa dev, así la aplicación arranca desde el IDE sin configurar nada.
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    placeholders:
      # Rol sin privilegios con el que se conecta la aplicación (ver V8).
      app_role: turnos_app
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC
  session:
    # Sesiones en PostgreSQL (tablas creadas por Flyway en V4).
    jdbc:
      initialize-schema: never
    timeout: 14d
  mail:
    properties:
      # Un proveedor que no responde no debe retener el envío: cada intento corta a los 10 segundos y se
      # reintenta más tarde (mucho antes de que venza el plazo de 2 minutos de un envío tomado).
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    # Thymeleaf solo arma los emails; las pantallas son del frontend.
    check-template-location: false

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  frontend-url: http://localhost:3000
  mail:
    from: no-responder@turnos.local
    from-name: Laciturnos
  rate-limit:
    requests-per-minute: 10
  # Cloudflare Turnstile para las reservas como invitado. Vacío lo desactiva (solo desarrollo y pruebas).
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY:}
  notifications:
    # Envía los avisos apenas se confirma el cambio del turno. La tarea periódica de JobRunr igual
    # revisa cada minuto los recordatorios, los resúmenes y los reintentos.
    send-on-commit: true

# Tareas en segundo plano y programadas. Las tablas las crea Flyway (V14), no JobRunr.
jobrunr:
  database:
    skip-create: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: false
  miscellaneous:
    allow-anonymous-data-usage: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # DECISIÓN: si el proveedor de email se cae, la API sigue atendiendo turnos. Los emails se
      # reintentan aparte; no deben marcar la aplicación como caída.
      enabled: false

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
