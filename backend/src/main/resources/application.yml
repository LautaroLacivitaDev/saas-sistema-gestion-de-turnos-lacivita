# Configuración común a todos los entornos.
# Lo específico de cada entorno va en application-{perfil}.yml.
spring:
  application:
    name: turnos
  profiles:
    # Sin perfil explícito se usa dev, así la aplicación arranca desde el IDE sin configurar nada.
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC
  session:
    # Sesiones en PostgreSQL (tablas creadas por Flyway en V4).
    jdbc:
      initialize-schema: never
    timeout: 14d

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  frontend-url: http://localhost:3000
  mail:
    from: no-responder@turnos.local
    from-name: Turnos
  rate-limit:
    requests-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # DECISIÓN: si el proveedor de email se cae, la API sigue atendiendo turnos. Los emails se
      # reintentan aparte; no deben marcar la aplicación como caída.
      enabled: false

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
