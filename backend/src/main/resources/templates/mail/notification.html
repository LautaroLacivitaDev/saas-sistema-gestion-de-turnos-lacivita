<!DOCTYPE html>
<!--
  Diseño de los emails de Laciturnos. Pensado primero para el celular: una columna de hasta 560 px, letra
  de 16 px y botones de al menos 44 px de alto. Los estilos van en línea porque muchos clientes de correo
  ignoran las hojas de estilo.

  Todo el contenido entra con th:text, que lo escapa: los textos del negocio y los datos del cliente nunca
  se interpretan como HTML. No usar th:utext.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${email.subject()}">Asunto</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f4f4f5;">
    <tr>
        <td align="center" style="padding:16px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:560px;background-color:#ffffff;border-radius:12px;">
                <tr>
                    <td style="padding:24px 20px 8px 20px;font-family:Arial,Helvetica,sans-serif;">
                        <h1 th:text="${email.subject()}"
                            style="margin:0;font-size:20px;line-height:28px;color:#18181b;font-weight:bold;">
                            Asunto</h1>
                    </td>
                </tr>
                <tr th:each="paragraph : ${email.paragraphs()}">
                    <td th:text="${paragraph}"
                        style="padding:8px 20px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#27272a;white-space:pre-line;">
                        Párrafo
                    </td>
                </tr>
                <tr th:if="${!email.details().isEmpty()}">
                    <td style="padding:12px 20px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="background-color:#f4f4f5;border-radius:8px;">
                            <tr th:each="detail : ${email.details()}">
                                <td style="padding:8px 12px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#52525b;">
                                    <span th:text="${detail.label()}">Dato</span><br>
                                    <strong th:text="${detail.value()}"
                                            style="font-size:16px;line-height:24px;color:#18181b;">Valor</strong>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr th:each="item : ${email.items()}">
                    <td th:text="${item}"
                        style="padding:6px 20px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#18181b;border-bottom:1px solid #e4e4e7;">
                        Renglón
                    </td>
                </tr>
                <tr th:each="action, state : ${email.actions()}">
                    <td style="padding:8px 20px;">
                        <a th:href="${action.url()}" th:text="${action.label()}"
                           th:style="${state.first}
                               ? 'display:block;min-height:44px;padding:12px 16px;border-radius:8px;background-color:#18181b;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;text-align:center;text-decoration:none;box-sizing:border-box;'
                               : 'display:block;min-height:44px;padding:12px 16px;border-radius:8px;border:1px solid #d4d4d8;color:#18181b;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;text-align:center;text-decoration:none;box-sizing:border-box;'">
                            Acción</a>
                    </td>
                </tr>
                <tr>
                    <td th:text="${email.footer()}"
                        style="padding:20px 20px 24px 20px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#71717a;">
                        Pie
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
