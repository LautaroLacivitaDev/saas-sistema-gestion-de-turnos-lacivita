# Producción. Todos los secretos llegan por variables de entorno, nunca desde el repositorio.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  # Flyway usa el rol dueño de las tablas; la aplicación, el rol sin privilegios de DATABASE_USERNAME.
  flyway:
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    placeholders:
      app_role: ${DATABASE_USERNAME}
  # Emails por SMTP de Resend (proveedor transaccional): el usuario es siempre "resend" y la
  # contraseña, una API key. Para usar otro proveedor alcanza con cambiar MAIL_HOST y MAIL_USERNAME.
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      # Cifrado obligatorio: sin TLS no se manda nada (ni la API key).
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  # Detrás del proxy inverso: toma la IP real y el esquema de los encabezados X-Forwarded-*.
  forward-headers-strategy: native

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
  # Obligatoria en producción: sin ella la aplicación no arranca.
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
