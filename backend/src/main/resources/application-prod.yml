# Producción. Todos los secretos llegan por variables de entorno, nunca desde el repositorio.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  # Flyway usa el rol dueño de las tablas; la aplicación, el rol sin privilegios de DATABASE_USERNAME.
  flyway:
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    placeholders:
      app_role: ${DATABASE_USERNAME}
  # Emails por SMTP de Resend (proveedor transaccional): el usuario es siempre "resend" y la
  # contraseña, una API key. Para usar otro proveedor alcanza con cambiar MAIL_HOST y MAIL_USERNAME.
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    # En el modo demo no se envían emails: puede quedar vacía.
    password: ${MAIL_PASSWORD:}
    properties:
      # Cifrado obligatorio: sin TLS no se manda nada (ni la API key).
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  # Render (y otros) indican el puerto en PORT.
  port: ${PORT:8080}
  # Detrás del proxy inverso: toma la IP real y el esquema de los encabezados X-Forwarded-*.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # DECISIÓN: el frontend (Vercel) hace de proxy de /api y siempre reescribe X-Forwarded-For con la IP
      # real del visitante; Render agrega la suya. Se confía en toda la cadena para que el límite de
      # intentos sea por visitante y no por la IP de salida de Vercel. Limitación conocida: quien llame
      # directo a la URL del backend puede inventar ese encabezado (ver docs/decisiones.md, Hito 10).
      internal-proxies: ".*"

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
  # Obligatoria en producción: sin ella la aplicación no arranca.
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
