# Producción. Todos los secretos llegan por variables de entorno, nunca desde el repositorio.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  # Flyway usa el rol dueño de las tablas; la aplicación, el rol sin privilegios de DATABASE_USERNAME.
  flyway:
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    placeholders:
      app_role: ${DATABASE_USERNAME}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

server:
  # Detrás del proxy inverso: toma la IP real y el esquema de los encabezados X-Forwarded-*.
  forward-headers-strategy: native

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
