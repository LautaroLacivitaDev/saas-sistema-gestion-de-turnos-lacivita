name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify compila, chequea el formato (Spotless) y corre todas las pruebas,
      # incluidas las de integración con PostgreSQL real (Testcontainers usa el Docker del runner).
      - name: Build y pruebas
        run: ./mvnw -B verify

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
